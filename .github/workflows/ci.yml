name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Committed report matches the task files
        run: python -m forge check-report
      - name: Harness tests (timeouts, crashes, broken-task detection, every task valid)
        run: pytest -v
      - name: Validate every task (10 runs each) and regenerate the report
        run: python -m forge validate --runs 10
